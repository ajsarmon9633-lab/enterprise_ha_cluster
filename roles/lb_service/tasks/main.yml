---
# tasks file for lb_service

- name: install the proxy
  ansible.builtin.dnf:
    name: haproxy
    state: present

- name: deploy the haproxy configuration
  ansible.builtin.template:
    path: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    owner: root
    group: root
    mode: '0644'

- name: alloww http port firewall
  ansible.builtin.firewalld:
    service: http
    permanent: true
    immediate: true
    state: enabled


- name: start and enable the haproxy
  ansible.builtin.systemd:
    name: haproxy
    state: started
    enabled: true
